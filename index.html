<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Accessible Form UI</title>
  </head>
  <body>
    <main>
      <div>
        <section>
          <form action="">
            <div>
              <label for="name">Full Name</label>
              <input type="text" placeholder="What should we call you?" />
            </div>
            <div>
              <label for="email">Email</label>
              <input type="text" placeholder="john@doe.com" />
            </div>
            <div>
              <label for="password">Enter Password</label>
              <input type="text" placeholder="*********" />
            </div>
            <div>
              <label for="password">Confirm Password</label>
              <input type="text" placeholder="**********" />
            </div>
            <button>Update Profile</button>
          </form>
        </section>
        <section>
          <div>
            <h3>65%</h3>
          </div>
          <strong>Profile Comleteness</strong>
          <div>
            <ul>
              <li>Create Account</li>
              <li>Update Roadmap Projects</li>
              <li>Setup Public Profile</li>
              <li>Complete your first project</li>
              <li>Invite your Friends</li>
            </ul>
          </div>
        </section>
      </div>
    </main>
  </body>
</html>
