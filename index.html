<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="style.css" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
    />
    <title>Accessible Form UI</title>
  </head>
  <body id="container">
    <main>
      <div class="accessible-form">
        <section>
          <form action="">
            <div>
              <label for="name">Full Name</label>
              <input
                id="name"
                type="text"
                aria-required="true"
                placeholder="What should we call you?"
              />
            </div>
            <div>
              <label for="email">Email</label>
              <input
                id="email"
                type="email"
                aria-required="true"
                placeholder="john@doe.com"
              />
            </div>
            <div>
              <label for="password">Enter Password</label>
              <div class="input-wrapper">
                <input
                  id="password"
                  type="password"
                  aria-required="true"
                  placeholder="*********"
                  aria-describedby="password-toggle"
                />
                <button
                  type="button"
                  class="icon"
                  id="password-toggle"
                  aria-label="Show password"
                  aria-pressed="false"
                >
                  <i class="fa-solid fa-eye"></i>
                </button>
              </div>
            </div>
            <div>
              <label for="confirm-password">Confirm Password</label>
              <div class="input-wrapper">
                <input
                  id="confirm-password"
                  type="password"
                  aria-required="true"
                  placeholder="**********"
                  aria-describedby="password-toggle"
                />

                <button
                  type="button"
                  class="icon"
                  id="password-toggle"
                  aria-label="Show password"
                  aria-pressed="false"
                >
                  <i class="fa-solid fa-eye"></i>
                </button>
              </div>
            </div>
            <button class="Btn" type="submit">Update Profile</button>
          </form>
        </section>
        <section>
          <div
            role="progressbar"
            aria-valuenow="65"
            aria-valuemin="0"
            aria-valuemax="100"
            aria-label="Profile completeness is 65 percent"
          >
            <strong>65%</strong>
          </div>
          <h2 id="progress-heading">Profile Completeness</h2>
          <div>
            <ul>
              <li>Create Account</li>
              <li>Update Roadmap Projects</li>
              <li>Setup Public Profile</li>
              <li>Complete your first project</li>
              <li>Invite your Friends</li>
            </ul>
          </div>
        </section>
      </div>
    </main>
  </body>
</html>
